services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: octera
      POSTGRES_PASSWORD: octera
      POSTGRES_DB: octera
    ports:
      - "5432:5432"
    volumes:
      - octera_db_data:/var/lib/postgresql/data

  backend:
    build: ./backend
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql+psycopg2://octera:octera@db:5432/octera
    depends_on:
      - db
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app

  frontend:
    build: ./frontend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    depends_on:
      - backend
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next

volumes:
  octera_db_data:
